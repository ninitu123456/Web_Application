name: FindIt tests and security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Coverage artifacts require the exact same runtime in every job. A moving
  # major can resolve to different patch releases across hosted runners.
  COVERAGE_NODE_VERSION: '24.22.2'
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.COVERAGE_NODE_VERSION }}'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:coverage
      - run: npm run audit:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/audit3/unit/
          if-no-files-found: error
          retention-days: 7
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.COVERAGE_NODE_VERSION }}'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Install only on this disposable runner. Tests never use the system service.
      - name: Prepare MySQL 8.0 executable
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server-8.0
          sudo systemctl stop mysql
          /usr/sbin/mysqld --version
      - name: All integration suites, including five controlled security race rounds
        env:
          MYSQLD_PATH: /usr/sbin/mysqld
        run: npm run test:coverage:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage/audit3/integration/
          if-no-files-found: error
          retention-days: 7
  coverage-integrity:
    needs: [unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.COVERAGE_NODE_VERSION }}'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: coverage/audit3/unit/
      - uses: actions/download-artifact@v4
        with:
          name: integration-coverage
          path: coverage/audit3/integration/
      - run: npm run test:coverage:combined
      - uses: actions/upload-artifact@v4
        with:
          name: combined-coverage
          path: coverage/audit3/combined/
          if-no-files-found: error
          retention-days: 7
